name: unis-plus-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: unis-plus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unisplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unisplus_dev}
      POSTGRES_DB: ${POSTGRES_DB:-unisplus_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unisplus}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: unis-plus-postgres-data